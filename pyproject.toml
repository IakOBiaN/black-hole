[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "black-hole-renderer"
version = "0.1.0"
description = "A cinematic Kerr black hole renderer built from first principles in Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "IakOBiaN" },
]
keywords = [
  "black-hole",
  "general-relativity",
  "gravitational-lensing",
  "kerr-metric",
  "ray-tracing",
  "scientific-visualization",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "imageio",
  "imageio-ffmpeg",
  "numba",
  "numpy",
  "pillow",
  "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/IakOBiaN/black-hole"
Repository = "https://github.com/IakOBiaN/black-hole"
Issues = "https://github.com/IakOBiaN/black-hole/issues"
Changelog = "https://github.com/IakOBiaN/black-hole/blob/main/CHANGELOG.md"

[project.scripts]
black-hole = "black_hole.snapshot:main"
black-hole-animate = "black_hole.animation:main"

[tool.setuptools]
packages = ["black_hole"]
package-dir = { black_hole = "src" }
